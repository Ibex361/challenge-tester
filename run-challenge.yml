name: Run Challenge Tester

on:
  # Runs automatically. Cron is in UTC. EAT = UTC+3.
  # 7:50 PM EAT = 16:50 UTC.
  schedule:
    - cron: "50 16 * * *"

  # Lets you trigger it manually from the Actions tab any time, e.g. for testing.
  workflow_dispatch: {}

jobs:
  run-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # hard safety cap; the script itself stops earlier

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute deadline
        id: deadline
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled run: listen until 8:05 PM EAT (17:05 UTC) today.
            DEADLINE=$(date -u +"%Y-%m-%dT17:05:00+00:00")
            echo "Scheduled run — deadline set to: $DEADLINE"
          else
            # Manual run (workflow_dispatch): listen for at most 15 minutes
            # from now, whatever time it is.
            DEADLINE=$(date -u -d "+15 minutes" +"%Y-%m-%dT%H:%M:%S+00:00")
            echo "Manual run — deadline set to: $DEADLINE (15 min from now)"
          fi
          echo "deadline=$DEADLINE" >> "$GITHUB_OUTPUT"

      - name: Run challenge flow
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          DEADLINE_UTC_ISO: ${{ steps.deadline.outputs.deadline }}
          TOTAL_QUESTIONS: "5"
          MIN_SECONDS_SINCE_START_QUIZ: "25"
        run: python run_challenge.py
