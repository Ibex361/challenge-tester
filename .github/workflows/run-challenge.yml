name: Run Challenge Tester

on:
  # Manual only -- trigger from the Actions tab and type in the challenge
  # number (e.g. 34). Run this at/just before 17:00 UTC so the script is
  # already listening the moment the bot's /start reply comes back.
  workflow_dispatch:
    inputs:
      challenge_number:
        description: "Challenge number to run (e.g. 34 -> sends '/start challenge_34' to the bot)"
        type: string
        required: true
      debug_log_all_events:
        description: "Log every incoming message (diagnostic mode)"
        type: boolean
        default: false
      gemini_model:
        description: "Gemini model override (e.g. gemini-3.5-flash-lite). Leave blank to use the script's default."
        type: string
        default: ""

jobs:
  run-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # hard safety cap; the script itself stops earlier

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute deadline
        id: deadline
        run: |
          # Listen for 15 minutes from whenever this job actually starts.
          DEADLINE=$(date -u -d "+15 minutes" +"%Y-%m-%dT%H:%M:%S+00:00")
          echo "Deadline set to: $DEADLINE (15 min from actual start)"
          echo "deadline=$DEADLINE" >> "$GITHUB_OUTPUT"

      - name: Run challenge flow
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHALLENGE_BOT_USERNAME: ${{ secrets.CHALLENGE_BOT_USERNAME }}
          CHALLENGE_NUMBER: ${{ github.event.inputs.challenge_number }}
          DEADLINE_UTC_ISO: ${{ steps.deadline.outputs.deadline }}
          TOTAL_QUESTIONS: "5"
          MIN_SECONDS_SINCE_START_QUIZ: "15"
          DEBUG_LOG_ALL_EVENTS: ${{ github.event.inputs.debug_log_all_events || 'false' }}
        run: |
          if [ -n "${{ github.event.inputs.gemini_model }}" ]; then
            export GEMINI_MODEL="${{ github.event.inputs.gemini_model }}"
            echo "Using GEMINI_MODEL override: $GEMINI_MODEL"
          else
            echo "No gemini_model input given -- using the script's built-in default"
          fi
          python run_challenge.py
