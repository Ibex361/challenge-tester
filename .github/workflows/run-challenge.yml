name: Run Challenge Tester

on:
  # Manual only. In real mode, trigger any time from 15 minutes before
  # 17:00 UTC (8:00 PM EAT) onward -- the script waits until then before
  # messaging the bot, and refuses to start at all if triggered earlier.
  # In test mode, enter the SAME activation time (in East Africa Time) you
  # gave "Run Test Bot" -- the tester follows the identical
  # wait/refuse/retry behavior, just anchored to that time instead of 17:00.
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode: run against the throwaway test_bot.py instead of the real bot -- no challenge number needed"
        type: boolean
        default: false
      test_activation_time_eat:
        description: "Test mode only: activation time (HH:MM, East Africa Time / UTC+3) -- must match what you gave 'Run Test Bot'"
        type: string
        default: ""
      challenge_number:
        description: "Challenge number to run (e.g. 34 -> sends '/start challenge_34' to the bot). Not needed if test_mode is checked."
        type: string
        default: ""
      debug_log_all_events:
        description: "Log every incoming message (diagnostic mode)"
        type: boolean
        default: false
      gemini_model:
        description: "Gemini model override (e.g. gemini-3.5-flash-lite). Leave blank to use the script's default."
        type: string
        default: ""

jobs:
  run-challenge:
    runs-on: ubuntu-latest
    # Worst case: triggered 15 min before activation, waits ~15 min, retries
    # for up to 5 more min after activation, then up to QUIZ_TIMEOUT_MINUTES
    # (15 by default) to answer the quiz. Kept well above that; the script's
    # own deadlines stop it earlier in practice.
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate inputs
        run: |
          if [ "${{ github.event.inputs.test_mode }}" != "true" ] && [ -z "${{ github.event.inputs.challenge_number }}" ]; then
            echo "::error::challenge_number is required unless test_mode is checked."
            exit 1
          fi
          if [ "${{ github.event.inputs.test_mode }}" == "true" ] && [ -z "${{ github.event.inputs.test_activation_time_eat }}" ]; then
            echo "::error::test_activation_time_eat is required when test_mode is checked -- use the same value you gave 'Run Test Bot'."
            exit 1
          fi

      - name: Convert activation time from EAT to UTC
        id: convert_time
        run: |
          eat_time="${{ github.event.inputs.test_activation_time_eat }}"
          if [ -n "$eat_time" ]; then
            # EAT is a fixed UTC+3 year-round (no DST), so a flat 3-hour
            # subtraction is always correct -- no timezone database needed.
            utc_time=$(python3 -c "h,m=map(int,'$eat_time'.split(':')); t=(h*60+m-180)%1440; print(f'{t//60:02d}:{t%60:02d}')")
            echo "Converted $eat_time EAT -> $utc_time UTC"
            echo "utc_time=$utc_time" >> "$GITHUB_OUTPUT"
          else
            echo "utc_time=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run challenge flow
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          TEST_ACTIVATION_TIME_UTC: ${{ steps.convert_time.outputs.utc_time }}
          TEST_BOT_USERNAME: ${{ secrets.TEST_BOT_USERNAME }}
          CHALLENGE_BOT_USERNAME: ${{ secrets.CHALLENGE_BOT_USERNAME }}
          CHALLENGE_NUMBER: ${{ github.event.inputs.challenge_number }}
          TOTAL_QUESTIONS: "5"
          MIN_SECONDS_SINCE_START_QUIZ: "15"
          DEBUG_LOG_ALL_EVENTS: ${{ github.event.inputs.debug_log_all_events || 'false' }}
        run: |
          if [ -n "${{ github.event.inputs.gemini_model }}" ]; then
            export GEMINI_MODEL="${{ github.event.inputs.gemini_model }}"
            echo "Using GEMINI_MODEL override: $GEMINI_MODEL"
          else
            echo "No gemini_model input given -- using the script's built-in default"
          fi
          python run_challenge.py
