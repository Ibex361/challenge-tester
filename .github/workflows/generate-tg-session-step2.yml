name: "Generate TG Session (2/2: Complete Login)"

on:
  # Manual only -- run AFTER "Generate TG Session (1/2: Request Code)" has
  # completed and you've received the login code from Telegram (check the
  # Telegram app itself first -- a message from the official "Telegram"
  # service account -- SMS is only a fallback after a short delay).
  # You must supply the SAME run's artifact from step 1 below (GitHub
  # Actions can't pass an artifact between workflows automatically -- see
  # the "Download intermediate session state" step).
  workflow_dispatch:
    inputs:
      step1_run_id:
        description: "The RUN ID from step 1's own 'Print the run ID needed for step 2' log line -- NOT the Artifact ID shown by the upload step (those are two different similar-looking numbers)."
        type: string
        required: true
      code:
        description: "The login code Telegram sent you"
        type: string
        required: true
      password:
        description: "Cloud password, ONLY if this account has Two-Step Verification enabled. Leave blank otherwise."
        type: string
        required: false
        default: ""

jobs:
  complete-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions/download-artifact@v4's cross-run download (via run-id below)
    # needs actions:read on the token it's given -- without this block,
    # github.token's default scope (especially on repos with "Read
    # repository contents" as the default workflow permission, rather than
    # the older broader default) doesn't include it, and the download
    # fails with a bare "Not Found" rather than a clearer permissions
    # error. Fixed 2026-09-14 after hitting exactly this on a real run.
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install telethon==1.36.0

      - name: Download intermediate session state from step 1
        uses: actions/download-artifact@v4
        with:
          name: tg-session-step1-state
          run-id: ${{ github.event.inputs.step1_run_id }}
          github-token: ${{ github.token }}

      - name: Complete Telegram login
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CODE: ${{ github.event.inputs.code }}
          TG_PASSWORD: ${{ github.event.inputs.password }}
        run: python generate_session_step2_complete_login.py
