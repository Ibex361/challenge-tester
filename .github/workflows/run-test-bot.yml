name: Run Test Bot

on:
  # Manual only -- start this right before running "Run Challenge Tester" in
  # test mode. Enter the SAME activation_time_utc value in both workflows:
  # this bot rejects /start until that time, and the tester waits for it.
  workflow_dispatch:
    inputs:
      activation_time_utc:
        description: "Activation time (HH:MM, UTC) -- /start is rejected before this. Must match the tester's test_activation_time_utc input."
        type: string
        required: true
      run_minutes:
        description: "How many minutes the test bot should stay listening"
        type: string
        default: "10"

jobs:
  run-test-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # safety cap above run_minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-test-bot.txt

      - name: Run test bot
        env:
          TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
          TEST_BOT_RUN_MINUTES: ${{ github.event.inputs.run_minutes }}
          TEST_ACTIVATION_TIME_UTC: ${{ github.event.inputs.activation_time_utc }}
          TEST_CHANNEL_ID: ${{ secrets.TEST_CHANNEL_ID }}
          TEST_ADMIN_USER_ID: ${{ secrets.TEST_ADMIN_USER_ID }}
        run: python test_bot.py
